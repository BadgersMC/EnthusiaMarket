name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEXUS_REF: 057836befb9e35aa252cf90104030ec86f28b33f
      LUMAGUILDS_VERSION: 3.0.39
      LUMAGUILDS_REF: 283d75f1e1016d415aa5afdfac840252f0391846
      LUMAGUILDS_SHA256: 3CA71CC1ADC2B3B69565755D25F0A5A2241B52163E41A08B005F7C50ACBB65F1
      LUMAGUILDS_JAR: ${{ github.workspace }}/libs/LumaGuilds-3.0.39.jar

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.1
        with:
          distribution: temurin
          java-version: 25

      - name: Bump version
        id: bump
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            BASE=$(grep -oP 'version\s*=\s*findProperty.*\?\s*:\s*"\K[^"]+' build.gradle.kts)
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
          else
            VER="${LATEST#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
          fi
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Latest tag: ${LATEST:-none}, bumping to v$NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish Nexus 2.3.0 dependency locally
        run: |
          git clone https://github.com/BadgersMC/Nexus.git "$RUNNER_TEMP/nexus"
          cd "$RUNNER_TEMP/nexus"
          git checkout "$NEXUS_REF"
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --console=plain

      - name: Download approved LumaGuilds release
        run: |
          mkdir -p libs
          ACTUAL_REF=$(git ls-remote https://github.com/BadgersMC/LumaGuilds.git \
            "refs/tags/v${LUMAGUILDS_VERSION}" | awk '{print $1}')
          test "$ACTUAL_REF" = "$LUMAGUILDS_REF"
          curl --fail --location --silent --show-error \
            -o "$LUMAGUILDS_JAR" \
            "https://github.com/BadgersMC/LumaGuilds/releases/download/v${LUMAGUILDS_VERSION}/LumaGuilds-${LUMAGUILDS_VERSION}.jar"
          test -s "$LUMAGUILDS_JAR"
          printf '%s  %s\n' "$LUMAGUILDS_SHA256" "$LUMAGUILDS_JAR" | sha256sum --check

      - name: Build shadowJar
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: ./gradlew shadowJar --no-daemon -PuseMavenLocal=true -PreleaseVersion="$RELEASE_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: EnthusiaMarket v${{ steps.bump.outputs.version }}
          files: build/libs/EnthusiaMarket-${{ steps.bump.outputs.version }}.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
