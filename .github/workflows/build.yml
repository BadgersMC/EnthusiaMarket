name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_REF: 057836befb9e35aa252cf90104030ec86f28b33f
      LUMAGUILDS_VERSION: 3.0.39
      LUMAGUILDS_REF: 283d75f1e1016d415aa5afdfac840252f0391846
      LUMAGUILDS_SHA256: 3CA71CC1ADC2B3B69565755D25F0A5A2241B52163E41A08B005F7C50ACBB65F1
      LUMAGUILDS_JAR: ${{ github.workspace }}/libs/LumaGuilds-3.0.39.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.1.0"

      # Nexus 2.3.0 contains the Paper 26.2 adapters but is not tagged/published yet.
      # Build the exact merged commit and consume it through the project's supported
      # Maven Local path rather than pointing JitPack at a nonexistent v2.3.0 tag.
      - name: Publish Nexus 2.3.0 dependency locally
        run: |
          git clone https://github.com/BadgersMC/Nexus.git "$RUNNER_TEMP/nexus"
          cd "$RUNNER_TEMP/nexus"
          git checkout "$NEXUS_REF"
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --console=plain

      # Compile and test against the exact approved released companion runtime.
      - name: Download approved LumaGuilds runtime
        run: |
          mkdir -p libs
          ACTUAL_REF=$(git ls-remote https://github.com/BadgersMC/LumaGuilds.git \
            "refs/tags/v${LUMAGUILDS_VERSION}" | awk '{print $1}')
          test "$ACTUAL_REF" = "$LUMAGUILDS_REF"
          curl --fail --location --silent --show-error \
            -o "$LUMAGUILDS_JAR" \
            "https://github.com/BadgersMC/LumaGuilds/releases/download/v${LUMAGUILDS_VERSION}/LumaGuilds-${LUMAGUILDS_VERSION}.jar"
          test -s "$LUMAGUILDS_JAR"
          printf '%s  %s\n' "$LUMAGUILDS_SHA256" "$LUMAGUILDS_JAR" | sha256sum --check

      # detekt 1.23.8 does not support running on JDK 25. Keep the production
      # build green on the required 26.2 toolchain; migrate detekt to 2.x separately.
      - name: Test and shadowJar
        run: ./gradlew test shadowJar jacocoTestReport -PuseMavenLocal=true --no-daemon

      - name: Verify MariaDB moderation tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(
              "build/test-results/test/"
              "TEST-net.badgersmc.em.infrastructure.moderation."
              "JdbcMarketModerationMariaDbTest.xml"
          )
          suite = ElementTree.parse(report).getroot()
          counts = {
              name: int(suite.attrib.get(name, "0"))
              for name in ("tests", "skipped", "failures", "errors")
          }
          print("MariaDB moderation tests:", counts)
          if counts["tests"] < 1 or any(counts[name] for name in ("skipped", "failures", "errors")):
              raise SystemExit("MariaDB moderation tests did not execute cleanly")
          PY

      - name: Verify companion XP runtime contract executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("build/test-results/test/TEST-net.badgersmc.em.infrastructure.guild.GuildShopXpRuntimeContractTest.xml")
          suite = ElementTree.parse(report).getroot()
          counts = {
              name: int(suite.attrib.get(name, "0"))
              for name in ("tests", "skipped", "failures", "errors")
          }
          print("Guild-shop XP runtime contract:", counts)
          if counts["tests"] < 1 or any(counts[name] for name in ("skipped", "failures", "errors")):
              raise SystemExit("Guild-shop XP v2 runtime contract did not execute cleanly")
          PY

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/test/jacocoTestReport.xml
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >
            p/kotlin
            p/java
            p/secrets
            p/sql-injection
        continue-on-error: true

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true
