name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      # Nexus is now resolved from JitPack — no clone/publish step needed.
      # See build.gradle.kts for the com.github.BadgersMC.Nexus coordinates.

      # RoseChat and LumaGuilds have a circular source-level compile dependency.
      # Building current LumaGuilds source also requires local optional jars that
      # are not present in this repository's CI environment. Use a published,
      # checksum-pinned LumaGuilds release for Market compilation, then compile
      # current RoseChat against that release to keep the integration contract
      # exercised without depending on unversioned LumaGuilds source state.
      - name: Fetch pinned LumaGuilds release
        id: lg
        env:
          LUMAGUILDS_VERSION: "2.1.24"
          LUMAGUILDS_SHA256: "54ad645587f2ce895738eff3ee05123eb19e5687d80fa6d657aa3092031004c2"
        run: |
          JAR="$RUNNER_TEMP/LumaGuilds-${LUMAGUILDS_VERSION}.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$JAR" \
            "https://github.com/BadgersMC/LumaGuilds/releases/download/v${LUMAGUILDS_VERSION}/LumaGuilds-${LUMAGUILDS_VERSION}.jar"
          echo "${LUMAGUILDS_SHA256}  ${JAR}" | sha256sum --check --strict
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/lumaguilds-out"
          cp "$JAR" "$RUNNER_TEMP/lumaguilds-out/LumaGuilds-2.1.0.jar"

      - name: Build RoseChat (master, with hook)
        run: |
          git clone --depth 1 --branch master https://github.com/BadgersMC/Enthusia-RoseChat.git "$RUNNER_TEMP/rosechat-master"
          mkdir -p "$RUNNER_TEMP/rosechat-master/libs"
          cp "$RUNNER_TEMP/lumaguilds-out/LumaGuilds-2.1.0.jar" "$RUNNER_TEMP/rosechat-master/libs/LumaGuilds-2.1.0.jar"
          cd "$RUNNER_TEMP/rosechat-master"
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Test and shadowJar
        env:
          LUMAGUILDS_JAR: ${{ steps.lg.outputs.jar }}
        run: ./gradlew test shadowJar jacocoTestReport --no-daemon

      - name: Verify MariaDB moderation tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(
              "build/test-results/test/"
              "TEST-net.badgersmc.em.infrastructure.moderation."
              "JdbcMarketModerationMariaDbTest.xml"
          )
          suite = ElementTree.parse(report).getroot()
          counts = {
              name: int(suite.attrib.get(name, "0"))
              for name in ("tests", "skipped", "failures", "errors")
          }
          print("MariaDB moderation tests:", counts)
          if counts["tests"] < 1 or any(counts[name] for name in ("skipped", "failures", "errors")):
              raise SystemExit("MariaDB moderation tests did not execute cleanly")
          PY

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/test/jacocoTestReport.xml
        continue-on-error: true

  quality-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lizard 1.22.2 complexity report
        run: |
          python -m pip install --disable-pip-version-check lizard==1.22.2
          lizard -C 8 -L 50 -w src/main src/test || true
      - name: PMD 7.11.0 CodeStyle report
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/pmd.zip" \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.11.0/pmd-dist-7.11.0-bin.zip"
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/pmd-bin-7.11.0/bin/pmd" check \
            -d src/main/java \
            -R category/java/codestyle.xml \
            -f text || true

  detekt:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.10.2"
      - name: Run detekt
        run: ./gradlew detekt --no-daemon
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >
            p/kotlin
            p/java
            p/secrets
            p/sql-injection
        continue-on-error: true

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true
