name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_REF: 057836befb9e35aa252cf90104030ec86f28b33f
      LUMAGUILDS_REF: 07a599fa1f732d9f4008ec4f8e02a25d0eda54a1 # public bank API, LumaGuilds PR 197
      LUMAGUILDS_JAR: ${{ github.workspace }}/libs/LumaGuilds-api.jar
      LUMAGUILDS_RUNTIME_JAR: ${{ github.workspace }}/libs/LumaGuilds-runtime.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.1.0"

      # Nexus 2.3.0 contains the Paper 26.2 adapters but is not tagged/published yet.
      # Build the exact merged commit and consume it through the project's supported
      # Maven Local path rather than pointing JitPack at a nonexistent v2.3.0 tag.
      - name: Publish Nexus 2.3.0 dependency locally
        run: |
          git clone https://github.com/BadgersMC/Nexus.git "$RUNNER_TEMP/nexus"
          cd "$RUNNER_TEMP/nexus"
          git checkout "$NEXUS_REF"
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --console=plain

      # Compile the real public API from the exact companion commit. The API is
      # JDK-only; its separate build avoids the runtime plugin dependency graph.
      # This validates the coordinated change before any plugin release is uploaded.
      - name: Build pinned LumaGuilds public API
        run: |
          git clone https://github.com/BadgersMC/LumaGuilds.git "$RUNNER_TEMP/lumaguilds"
          git -C "$RUNNER_TEMP/lumaguilds" checkout "$LUMAGUILDS_REF"
          ./gradlew -p ci/lumaguilds-api jar \
            -PlumaSourceDir="$RUNNER_TEMP/lumaguilds/src/main/kotlin" --no-daemon
          mkdir -p libs
          cp ci/lumaguilds-api/build/libs/LumaGuilds-api.jar "$LUMAGUILDS_JAR"

      # Preserve reflection/event discovery coverage against a real released plugin.
      # The companion API above is first on the test classpath; bank implementation
      # behavior is covered in the companion LumaGuilds PR, not by this fixture.
      - name: Download LumaGuilds event runtime fixture
        run: |
          curl --fail --location --silent --show-error \
            -o "$LUMAGUILDS_RUNTIME_JAR" \
            "https://github.com/BadgersMC/LumaGuilds/releases/download/v3.0.14/LumaGuilds-3.0.14.jar"
          test -s "$LUMAGUILDS_RUNTIME_JAR"

      # detekt 1.23.8 does not support running on JDK 25. Keep the production
      # build green on the required 26.2 toolchain; migrate detekt to 2.x separately.
      - name: Test and shadowJar
        run: ./gradlew test shadowJar jacocoTestReport -PuseMavenLocal=true --no-daemon

      - name: Verify MariaDB moderation tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(
              "build/test-results/test/"
              "TEST-net.badgersmc.em.infrastructure.moderation."
              "JdbcMarketModerationMariaDbTest.xml"
          )
          suite = ElementTree.parse(report).getroot()
          counts = {
              name: int(suite.attrib.get(name, "0"))
              for name in ("tests", "skipped", "failures", "errors")
          }
          print("MariaDB moderation tests:", counts)
          if counts["tests"] < 1 or any(counts[name] for name in ("skipped", "failures", "errors")):
              raise SystemExit("MariaDB moderation tests did not execute cleanly")
          PY

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/test/jacocoTestReport.xml
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >
            p/kotlin
            p/java
            p/secrets
            p/sql-injection
        continue-on-error: true

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true
